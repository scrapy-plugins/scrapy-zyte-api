[tox]
min_version = 4.25.0
requires =
    sphinx-scrapy @ git+https://github.com/scrapy/sphinx-scrapy.git@0.8.12
envlist =
    pre-commit
    mypy
    min
    min-extra
    min-provider
    min-x402
    py3{11-15}
    extra
    provider
    x402
    reactorless
    provider-reactorless
    docs
    twine

[testenv]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-twisted
    pytest-xdist
passenv =
    PYTEST_ADDOPTS
setenv =
    # Pinned old Python and library versions trigger warnings that we cannot
    # fix, so these envs do not turn warnings into errors.
    min: PYTEST_ADDOPTS=-W default {env:PYTEST_ADDOPTS:}
commands =
    py.test \
    --cov-report=term-missing \
    --cov-report=html:coverage-html \
    --cov-report=xml \
    --cov=scrapy_zyte_api \
    --junitxml=test-results/junit.xml \
    --reactor=asyncio \
    {posargs:scrapy_zyte_api tests}

[testenv:pre-commit]
deps = pre-commit
commands = pre-commit run --all-files --show-diff-on-failure

[testenv:mypy]
extras = provider
deps =
    mypy==2.3.1
    zyte-api==0.11.0
    pytest==9.1.1
    scrapy-poet==0.27.2
    Twisted==26.4.0
commands = mypy scrapy_zyte_api tests

[min]
deps =
    {[testenv]deps}
    packaging==20.0
    scrapy==2.7.0

    # https://stackoverflow.com/a/73046084
    Twisted==21.7.0
    # Scrapy 2.15 and lower import names that w3lib 2.5.0 removed.
    w3lib<2.5.0

[testenv:min]
basepython=python3.11
deps =
    {[min]deps}
    # here to not conflict with [testenv:min-x402]
    zyte-api==0.6.0

[testenv:min-extra]
basepython=python3.11
deps =
    {[testenv:min]deps}
    scrapy-crawlera==1.1.0
    scrapy-zyte-smartproxy==2.0.0

[testenv:min-provider]
basepython=python3.11
extras = provider
deps =
    {[testenv:min]deps}
    andi==0.6.0
    scrapy-poet==0.22.3
    web-poet==0.17.0
    zyte-common-items==0.27.0

[testenv:min-x402]
basepython=python3.11
extras = x402
deps =
    {[min]deps}
    # https://github.com/zytedata/python-zyte-api/blob/0.8.0/setup.py#L29-L30
    zyte-api[x402]==0.8.0
    eth-account==0.13.7
    x402==0.1.1

[testenv:extra]
deps =
    {[testenv]deps}
    scrapy-crawlera
    scrapy-zyte-smartproxy

[testenv:provider]
extras = provider

[testenv:x402]
extras = x402

# Run the test suite without a Twisted reactor (TWISTED_REACTOR_ENABLED=False),
# which requires Scrapy >= 2.15. pytest-asyncio replaces pytest-twisted, and
# the httpx-based download handler replaces the Twisted-based one.
[reactorless]
deps =
    pytest
    pytest-cov >= 7.0.0
    pytest-asyncio
    pytest-xdist
    httpx
    scrapy>=2.15.0
# --reactor is passed through the environment, and not on the command line, so
# that pytest-xdist worker processes, which do not get the command line, can
# see it as well.
setenv =
    PYTEST_ADDOPTS=--reactor=none {env:PYTEST_ADDOPTS:}
commands =
    py.test \
    --cov-report=term-missing \
    --cov-report=html:coverage-html \
    --cov-report=xml \
    --cov=scrapy_zyte_api \
    --junitxml=test-results/junit.xml \
    {posargs:scrapy_zyte_api tests}

[testenv:reactorless]
deps = {[reactorless]deps}
setenv = {[reactorless]setenv}
commands = {[reactorless]commands}

[testenv:provider-reactorless]
extras = provider
deps = {[reactorless]deps}
setenv = {[reactorless]setenv}
commands = {[reactorless]commands}

[testenv:vcs-deps]
extras = provider
deps =
    {[testenv]deps}
    pytest-timeout
    uv
# The development branches of these distributions usually cannot be resolved
# together, because each caps the others at their latest release. --no-deps
# skips resolution entirely, replacing only these distributions and leaving the
# rest of the environment as the install above resolved it.
commands_pre =
    uv pip install --python {envpython} --no-deps --reinstall \
        git+https://github.com/pypa/packaging \
        git+https://github.com/scrapinghub/andi \
        git+https://github.com/scrapinghub/scrapy-poet \
        git+https://github.com/scrapinghub/web-poet \
        git+https://github.com/scrapy/scrapy \
        git+https://github.com/zytedata/python-zyte-api \
        git+https://github.com/zytedata/zyte-common-items

[testenv:twine]
deps =
    twine==7.0.0
    build==1.5.0
commands =
    python -m build --sdist
    twine check dist/*
