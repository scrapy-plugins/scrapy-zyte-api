# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: tox

permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.10'
          toxenv: min-scrapy-2x0
        - python-version: '3.10'
          toxenv: min-scrapy-2x1
        - python-version: '3.10'
          toxenv: min-scrapy-2x3
        - python-version: '3.10'
          toxenv: min-scrapy-2x4
        - python-version: '3.10'
          toxenv: min-scrapy-2x5
        - python-version: '3.10'
          toxenv: min-scrapy-2x6
        - python-version: '3.10'
          toxenv: min-scrapy-2x7
        - python-version: '3.10'
          toxenv: min-extra
        - python-version: '3.10'
          toxenv: min-provider
        - python-version: '3.10'
          toxenv: min-x402
        - python-version: '3.10'
        - python-version: '3.11'
        - python-version: '3.12'
        - python-version: '3.13'
        - python-version: '3.13'
          toxenv: extra
        - python-version: '3.13'
          toxenv: provider
        - python-version: '3.13'
          toxenv: x402
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: tox
      run: |
        tox -e ${{ matrix.toxenv || 'py' }} -- -n auto
    - name: coverage
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with pyproject.toml tool.sphinx-scrapy.python-version.
        python-version: ["3.13"]
        tox-job: ["pre-commit", "mypy", "twine", "docs"]

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: tox
      run: |
        tox -e ${{ matrix.tox-job }}
