name: VCS dependencies

permissions:
  contents: read

on:
  schedule:
  - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ${{github.workflow}}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # A development branch of a dependency can make a test hang forever, so
      # tests get a time limit here that they do not need elsewhere.
      PYTEST_ADDOPTS: -n auto --no-cov --timeout=120
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    # The upcoming Python version, so that incompatibilities with it are also
    # reported early.
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.15"
        allow-prereleases: true
    # Dependencies do not ship wheels for the upcoming Python version yet, so
    # lxml builds from source, which needs the libxml2 and libxslt headers.
    - name: Install system libraries
      run: |
        sudo apt-get update
        sudo apt-get install libxml2-dev libxslt-dev
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install tox
    - name: tox
      run: |
        tox -e vcs-deps
