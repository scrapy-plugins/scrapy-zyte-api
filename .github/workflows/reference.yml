name: Zyte API reference

permissions:
  contents: read

on:
  schedule:
  - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.14"
    - run: python -m pip install . pyyaml
    - name: Report differences in an issue
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: Misalignment with the Zyte API reference
      run: |
        report=$(python .github/check-reference.py)
        if [ -z "$report" ]; then exit 0; fi
        number=$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number")
        if [ -n "$number" ]; then
          gh issue edit "$number" --body "$report"
        else
          gh issue create --title "$TITLE" --body "$report"
        fi
